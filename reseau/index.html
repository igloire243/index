<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Réseau — mon carnet de contacts</title>
  <meta name="description" content="Carnet de contacts personnel : retrouve qui contacter, dans quel domaine, et qui est près de toi.">
  <meta name="theme-color" content="#0f172a">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Réseau</h1>
    <div class="top-actions">
      <button id="btn-locate" class="icon-btn" type="button" aria-label="Utiliser ma position" title="Utiliser ma position">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>
      </button>
      <button id="btn-menu" class="icon-btn" type="button" aria-label="Menu" title="Menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="view-contacts" class="view">
      <input id="search" type="search" placeholder="Chercher un nom, un domaine, une ville…" autocomplete="off" aria-label="Rechercher">
      <div id="chips" class="chips" role="group" aria-label="Filtrer par domaine"></div>
      <div class="toolbar">
        <span id="count" class="muted"></span>
        <label class="muted">Trier par
          <select id="sort">
            <option value="name">nom</option>
            <option value="distance">distance</option>
            <option value="recent">ajout récent</option>
            <option value="relance">à relancer</option>
          </select>
        </label>
      </div>
      <ul id="list" class="list"></ul>
      <div id="empty" class="empty" hidden></div>
    </section>

    <section id="view-map" class="view" hidden>
      <div class="map-tools">
        <label>Domaine
          <select id="map-domain"></select>
        </label>
        <label>Rayon
          <select id="map-radius">
            <option value="1">1 km</option>
            <option value="5">5 km</option>
            <option value="10">10 km</option>
            <option value="25">25 km</option>
            <option value="50" selected>50 km</option>
            <option value="100">100 km</option>
            <option value="0">Illimité</option>
          </select>
        </label>
      </div>
      <div id="map" role="application" aria-label="Carte de mes contacts"></div>
      <p id="map-hint" class="muted hint"></p>
      <ul id="nearby" class="list"></ul>
    </section>

    <section id="view-domains" class="view" hidden>
      <p class="muted hint">Pour chaque domaine, la liste de ceux que tu peux appeler.</p>
      <div id="domains"></div>
    </section>

    <section id="view-coach" class="view" hidden>
      <div id="coach"></div>
    </section>
  </main>

  <button id="fab" class="fab" type="button" aria-label="Ajouter un contact">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabs" aria-label="Navigation">
    <button type="button" data-view="contacts" class="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6M18 14.4c1.8.9 3 2.8 3 5.6"/></svg>
      Contacts
    </button>
    <button type="button" data-view="map">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      Carte
    </button>
    <button type="button" data-view="domains">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
      Domaines
    </button>
    <button type="button" data-view="coach">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>
      Coach
    </button>
  </nav>

  <dialog id="dlg-detail"><div class="sheet" id="detail"></div></dialog>

  <dialog id="dlg-form">
    <form id="form" class="sheet" autocomplete="off">
      <h2 id="form-title">Nouveau contact</h2>

      <label>Nom *
        <input id="f-name" required maxlength="120" autocapitalize="words">
      </label>
      <div class="two">
        <label>Téléphone
          <input id="f-phone" type="tel" inputmode="tel" placeholder="+243 …" maxlength="40">
        </label>
        <label>Email
          <input id="f-email" type="email" inputmode="email" maxlength="120">
        </label>
      </div>
      <label>Domaines <span class="muted">(séparés par des virgules)</span>
        <input id="f-domains" placeholder="juridique, santé, immobilier…" maxlength="200">
      </label>
      <div id="f-suggest" class="chips small"></div>
      <label>Rôle / profession
        <input id="f-role" placeholder="Avocat, plombier, directeur de banque…" maxlength="120">
      </label>

      <label>Lieu <span class="muted">(ville ou adresse)</span>
        <input id="f-place" placeholder="Kinshasa, Gombe" maxlength="200">
      </label>
      <div class="geo-row">
        <button type="button" id="f-geocode" class="btn small">Localiser</button>
        <button type="button" id="f-here" class="btn small">Ma position actuelle</button>
        <span id="f-geo-status" class="muted"></span>
      </div>

      <label>Comment on s'est connus
        <input id="f-how" maxlength="200">
      </label>
      <label>Anecdote / histoire à retenir
        <textarea id="f-anecdote" rows="2" maxlength="1000"></textarea>
      </label>
      <label>Notes
        <textarea id="f-notes" rows="2" maxlength="2000"></textarea>
      </label>
      <div class="two">
        <label>Services
          <select id="f-favor">
            <option value="">Rien en cours</option>
            <option value="owed">Cette personne me doit un service</option>
            <option value="owe">Je lui dois un service</option>
          </select>
        </label>
        <label>Dernier contact
          <input id="f-last" type="date">
        </label>
      </div>

      <div class="actions">
        <button type="button" id="f-cancel" class="btn">Annuler</button>
        <button type="submit" class="btn primary">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-menu">
    <div class="sheet">
      <h2>Mes données</h2>
      <p class="muted">Tes contacts sont enregistrés uniquement sur cet appareil. Fais une sauvegarde de temps en temps, et utilise-la pour les retrouver sur un autre téléphone.</p>
      <div class="menu-list">
        <button type="button" id="m-export" class="btn">Exporter une sauvegarde (.json)</button>
        <button type="button" id="m-import" class="btn">Importer (.json ou .vcf de Google Contacts)</button>
        <button type="button" id="m-wipe" class="btn danger">Tout effacer</button>
        <button type="button" id="m-close" class="btn">Fermer</button>
      </div>
      <input id="file" type="file" accept=".json,.vcf,application/json,text/vcard,text/x-vcard" hidden>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
